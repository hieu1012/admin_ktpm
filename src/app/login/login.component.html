<div class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-blue-500 to-indigo-600">
    <div class="bg-white shadow-2xl rounded-xl p-10 w-full max-w-md animate-fade-in">
        <div class="flex justify-center mb-6">
            <img src="/assets/logo.png" alt="Chill Guys" class="w-40 h-40" />
        </div>
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Đăng Nhập Admin</h2>
        <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-5">
            <div>
                <label class="block text-gray-600">Email</label>
                <input type="email" name="email" [(ngModel)]="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-gray-600">Mật khẩu</label>
                <input type="password" name="password" [(ngModel)]="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
            <button type="submit"
                class="w-full py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                Đăng Nhập
            </button>
            <p class="text-sm text-center mt-4 text-gray-500">
                Bạn chưa có tài khoản?
                <a routerLink="/register" class="text-blue-600 hover:underline">Đăng ký ngay</a>
            </p>
        </form>
    </div>
</div>
