<kendo-dialog *ngIf="isVisible" title="Xác nhận xóa" (close)="cancelDelete()"
    class="shadow-lg rounded-lg overflow-hidden">
    <div class="p-6">
        <!-- Thông báo xác nhận -->
        <div class="flex items-start mb-5">
            <div class="mr-4 text-amber-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <p class="text-gray-800 text-lg font-medium">
                Bạn có chắc chắn muốn xóa <span class="font-bold text-red-600">{{ selectedItems.length || 0 }}</span>
                người dùng đã chọn?
            </p>
        </div>

        <!-- Cảnh báo không thể khôi phục -->
        <div class="mb-5 bg-red-50 border-l-4 border-red-500 p-4 rounded-r">
            <div class="flex items-start">
                <div class="mr-3 text-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <p class="text-sm text-gray-600">
                    Hành động này không thể hoàn tác. Dữ liệu sẽ bị xóa vĩnh viễn.
                </p>
            </div>
        </div>

        <!-- Hiển thị trạng thái đang xóa -->
        <div *ngIf="isDeleting" class="flex items-center mt-4 text-blue-600 bg-blue-50 p-3 rounded">
            <svg class="animate-spin h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span class="text-sm">Đang xử lý xóa...</span>
        </div>
    </div>

    <kendo-dialog-actions class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
        <button kendoButton (click)="cancelDelete()" [disabled]="isDeleting"
            class="px-4 py-2 bg-white border border-gray-300 rounded-md font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
            Hủy
        </button>
        <button kendoButton themeColor="primary" (click)="bulkDeleteProducts()"
            [disabled]="isDeleting || !selectedItems || selectedItems.length === 0"
            class="px-4 py-2 bg-red-600 border border-transparent rounded-md font-medium !text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!isDeleting" class="">Xóa</span>
            <span *ngIf="isDeleting">Đang xử lý...</span>
        </button>
    </kendo-dialog-actions>
</kendo-dialog>
