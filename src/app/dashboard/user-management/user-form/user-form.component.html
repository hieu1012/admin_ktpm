<!-- Sửa modal title -->
<nz-modal [(nzVisible)]="isVisible" [nzTitle]="formTitle" [nzCentered]="true"
    [nzBodyStyle]="{ maxHeight: '80vh', padding: '0' }" [nzFooter]="modalFooter" (nzOnCancel)="handleCancel()"
    (nzOnOk)="handleOk()" [nzClosable]="true">
    <ng-container *nzModalContent>
        <form [formGroup]="userForm" class="grid grid-cols-1 gap-4 py-[20px] px-[28px]">
            <!-- Họ tên -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 gap-1">
                    Họ tên
                    <span class="text-red-500">*</span>
                    <span
                        *ngIf="userForm.get('name')?.invalid && (userForm.get('name')?.dirty || userForm.get('name')?.touched)"
                        class="text-red-500 text-xs font-normal ml-1">
                        <ng-container *ngIf="userForm.get('name')?.errors?.['required']">(Không được để
                            trống)</ng-container>
                    </span>
                </label>
                <input formControlName="name" nz-input placeholder="Nguyễn Văn A"
                    class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email
                    <span class="text-red-500">*</span>
                    <span
                        *ngIf="userForm.get('email')?.invalid && (userForm.get('email')?.dirty || userForm.get('email')?.touched)"
                        class="text-red-500 text-xs font-normal ml-1">
                        <ng-container *ngIf="userForm.get('email')?.errors?.['required']">(Không được để
                            trống)</ng-container>
                        <ng-container *ngIf="userForm.get('email')?.errors?.['email']">(Email không hợp
                            lệ)</ng-container>
                    </span>
                </label>
                <input formControlName="email" nz-input placeholder="example@gmail.com"
                    class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
            </div>

            <!-- Số điện thoại -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 ">
                    Số điện thoại
                    <span class="text-red-500"> *</span>
                    <span
                        *ngIf="userForm.get('phone')?.invalid && (userForm.get('phone')?.dirty || userForm.get('phone')?.touched)"
                        class="text-red-500 text-xs font-normal ml-1">
                        <ng-container *ngIf="userForm.get('phone')?.errors?.['required']">(Không được để
                            trống)</ng-container>
                        <ng-container *ngIf="userForm.get('phone')?.errors?.['pattern']">(Số điện thoại phải 10 số, bắt
                            đầu là số 0)</ng-container>
                    </span>
                </label>
                <input formControlName="phone" nz-input placeholder="0912345678"
                    class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
            </div>

            <!-- Mật khẩu -->
            <ng-container *ngIf="!isEditMode">
                <!-- Mật khẩu -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Mật khẩu
                        <span class="text-red-500">*</span>
                        <!-- ... -->
                    </label>
                    <input formControlName="password" nz-input type="password" placeholder="Nhập mật khẩu"
                        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
                </div>

                <!-- Xác nhận mật khẩu -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Xác nhận mật khẩu
                        <span class="text-red-500">*</span>
                        <!-- ... -->
                    </label>
                    <input formControlName="passwordConfirm" nz-input type="password" placeholder="Xác nhận mật khẩu"
                        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
                </div>
            </ng-container>

            <!-- Vai trò -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Vai trò
                </label>
                <nz-select formControlName="role" class="w-full">
                    <nz-option nzValue="user" nzLabel="User"></nz-option>
                    <nz-option nzValue="staff" nzLabel="Staff"></nz-option>
                    <nz-option nzValue="admin" nzLabel="Admin"></nz-option>
                </nz-select>
            </div>

            <!-- Trạng thái -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Trạng thái
                </label>
                <nz-select formControlName="status" class="w-full">
                    <nz-option nzValue="active" nzLabel="Active"></nz-option>
                    <nz-option nzValue="inactive" nzLabel="Inactive"></nz-option>
                    <nz-option nzValue="locked" nzLabel="Locked"></nz-option>
                </nz-select>
            </div>
        </form>
    </ng-container>

    <ng-template #modalFooter>
        <div class="flex justify-between items-center w-full">
            <button class="w-[48%] !rounded-[10px]" nz-button nzType="default" (click)="handleCancel()">
                Hủy
            </button>
            <button class="w-[48%] !rounded-[10px]" nz-button nzType="primary" (click)="handleOk()"
                [nzLoading]="isConfirmLoading">
                Lưu
            </button>
        </div>
    </ng-template>
</nz-modal>
