<kendo-grid [data]="gridData" [height]="400">
    <ng-template kendoGridToolbarTemplate>
        <button kendoGridAddCommand>Thêm sản phẩm mới</button>
    </ng-template>
    <kendo-grid-column field="id" title="ID" [width]="50"></kendo-grid-column>
    <kendo-grid-column field="name" title="Tên sản phẩm"></kendo-grid-column>
    <kendo-grid-column field="price" title="Giá" [width]="150">
        <ng-template kendoGridCellTemplate let-dataItem>
            {{ dataItem.price }} đ
        </ng-template>
    </kendo-grid-column>
    <kendo-grid-column field="shortDesc" title="Mô tả ngắn"></kendo-grid-column>
    <kendo-grid-column field="quantity" title="Tồn kho" [width]="80"></kendo-grid-column>
    <kendo-grid-column field="category.name" title="Danh mục"></kendo-grid-column>
    <kendo-grid-column field="manufacture.name" title="Hãng sản xuất"></kendo-grid-column>
    <kendo-grid-column title="Ảnh" [width]="100">
        <ng-template kendoGridCellTemplate let-dataItem>
            <img [src]="dataItem.image" alt="{{ dataItem.name }}" width="60" />
        </ng-template>
    </kendo-grid-column>
    <kendo-grid-column title="" [width]="160">
        <ng-template kendoGridCellTemplate let-dataItem class="justify-between">
            <button kendoGridEditCommand [primary]="true">Edit</button>
            <button kendoGridRemoveCommand class="ml-4">Remove</button>
        </ng-template>
    </kendo-grid-column>
</kendo-grid>
